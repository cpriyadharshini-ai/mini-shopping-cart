<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Mini shopping cart</h1>
    </header>
    <main>
        <section>
            <div class="search">
                <input type="text" name="search" id="search" placeholder="What do you need?.....">
                <button class="search-btn" onclick="searchProduct()">Search</button>
            </div>
            <div id="searchProduct"></div>
            <div class="addproduct">
                <input type="text" name="product" id="product" placeholder="Enter your product name">
                <input type="number" name="price" id="price" placeholder="Enter your product price">
                <input type="number" name="quantity" id="quantity" placeholder="Enter your product quantity">
                <button class="add-btn" onclick="addProduct()">Add cart</button>
            </div>
            <div id="show"></div>
            <div class="addprice">
                <button class="price-btn" onclick="addPrice()">Calculate Total</button>
            </div>
            <div id="showPrice"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
